<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev | Red Social para Desarrolladores</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Font Awesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="logo">Dev</div>
        <div class="header-actions">
            <button id="theme-toggle" class="btn-icon" title="Cambiar Tema"><i class="fas fa-moon"></i></button>
            <button class="btn-add" title="Publicar"><i class="fas fa-plus"></i></button>
        </div>
    </header>

    <nav class="sidebar">
        <div class="nav-item active" title="Mundo">
            <i class="fas fa-globe"></i>
        </div>
        <div class="nav-item" title="Grupos">
            <i class="fas fa-users"></i>
        </div>
        <div class="nav-item" title="Amigos">
            <i class="fas fa-user-friends"></i>
        </div>
        <div class="nav-item" title="Más">
            <i class="fas fa-ellipsis-h"></i>
        </div>
    </nav>

    <main id="app">
        <!-- Las publicaciones se cargarán aquí -->
        <div id="feed"></div>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
