<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev | Red Social para Desarrolladores</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Font Awesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="logo">Dev</div>
        <div class="header-actions">
            <button id="theme-toggle" class="btn-icon" title="Cambiar Tema"><i class="fas fa-moon"></i></button>
            <button class="btn-add" title="Publicar"><i class="fas fa-plus"></i></button>
        </div>
    </header>

    <nav class="sidebar" id="main-sidebar">
        <div class="nav-item active" title="Inicio" data-nav="home">
            <i class="fas fa-home"></i>
        </div>
        <div class="nav-item" title="Grupos" data-nav="groups">
            <i class="fas fa-users"></i>
        </div>
        <div class="nav-item" title="Amigos" data-nav="friends">
            <i class="fas fa-user-friends"></i>
        </div>
        <div class="nav-item" title="Notificaciones" data-nav="notifications">
            <i class="fas fa-bell"></i>
        </div>
        <div class="nav-item" title="Más" data-nav="more">
            <i class="fas fa-ellipsis-h"></i>
        </div>
        <div class="nav-item" title="Configuración" data-nav="settings">
            <i class="fas fa-cog"></i>
        </div>
    </nav>

    <main id="app">
        <!-- Las publicaciones se cargarán aquí -->
        <div id="feed"></div>
    </main>

    <!-- Modal para Publicar -->
    <div id="publish-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Crear Publicación</h3>
                <span class="close-modal">&times;</span>
            </div>
            <div class="modal-body">
                <textarea id="post-text" placeholder="¿Qué estás pensando, desarrollador?" maxlength="500"></textarea>
                <div class="char-counter">0/500</div>

                <div class="post-options">
                    <div class="option-group">
                        <h4>Multimedia</h4>
                        <div class="option-item disabled" title="Mejora a PRO para subir fotos">
                            <i class="fas fa-image"></i> Fotos <i class="fas fa-lock lock-icon"></i>
                        </div>
                    </div>

                    <div class="option-group">
                        <h4>Animaciones y Estilo</h4>
                        <div class="animations-grid">
                            <div class="option-item disabled" title="PRO: Animación Lluvia">
                                <i class="fas fa-cloud-showers-heavy"></i> Lluvia <i class="fas fa-lock lock-icon"></i>
                            </div>
                            <div class="option-item disabled" title="PRO: Animación Tristeza">
                                <i class="fas fa-frown"></i> Tristeza <i class="fas fa-lock lock-icon"></i>
                            </div>
                            <div class="option-item disabled" title="PRO: Animación Felicidad">
                                <i class="fas fa-smile"></i> Felicidad <i class="fas fa-lock lock-icon"></i>
                            </div>
                        </div>
                    </div>

                    <div class="option-group">
                        <h4>Iluminación y Burbuja</h4>
                        <div class="option-item disabled" title="PRO: Iluminación de texto">
                            <i class="fas fa-lightbulb"></i> Iluminación <i class="fas fa-lock lock-icon"></i>
                        </div>
                        <div class="option-item disabled" title="PRO: Fondo de burbuja personalizado">
                            <i class="fas fa-circle-dot"></i> Estilo de Burbuja <i class="fas fa-lock lock-icon"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="submit-post" class="btn-primary">Publicar</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
